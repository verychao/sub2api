name: Branch Image

on:
  push:
    branches:
      - feature/platform-usage-sync
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: false
        default: feature/platform-usage-sync
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: sub2api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set lowercase owner
        id: vars
        run: |
          BRANCH_NAME='${{ github.event.inputs.branch || github.ref_name }}'
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "branch_slug=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | tr '/_' '--')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.branch_slug }}
            type=raw,value=${{ steps.vars.outputs.branch_slug }}-${{ steps.vars.outputs.short_sha }}
            type=raw,value=branch-latest
          labels: |
            org.opencontainers.image.title=Sub2API
            org.opencontainers.image.description=Sub2API branch build for upstream balance sync validation
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
